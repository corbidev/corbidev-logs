doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        profiling_collect_backtrace: '%kernel.debug%'

    orm:
        auto_mapping: false

        validate_xml_mapping: true

        naming_strategy: doctrine.orm.naming_strategy.underscore

        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity

        mappings:
            # App:
            #     type: attribute
            #     is_bundle: false
            #     dir: '%kernel.project_dir%/src/Entity'
            #     prefix: 'App\Entity'
            #     alias: App

            Jwt:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Jwt/Entity'
                prefix: 'App\Jwt\Entity'
                alias: Jwt

            Persistence:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Persistence/Infrastructure/Entity'
                prefix: 'App\Persistence\Infrastructure\Entity'
                alias: Persistence

when@test:
    doctrine:
        dbal:
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool

            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:

                doctrine.result_cache_pool:
                    adapter: cache.app

                doctrine.system_cache_pool:
                    adapter: cache.system
